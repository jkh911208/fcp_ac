name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FCPCaptionCore (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Whatever Xcode the runner image defaults to, as long as it can build tools-version 6.0.
      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: FCPCaptionCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('FCPCaptionCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: FCPCaptionCore
        run: swift build

      # The core package is deliberately free of UI, FCP and network dependencies, so this is
      # the whole test suite and it needs no model download and no simulator.
      - name: Test
        working-directory: FCPCaptionCore
        run: swift test
